<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; }
canvas { display: block; background: #16213e; border: 2px solid #0f3460; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const box = 20;
let snake = [{x: 9, y: 10}];
let food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
let dir = 'RIGHT';
let score = 0;

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft' && dir !== 'RIGHT') dir = 'LEFT';
  else if(e.key === 'ArrowUp' && dir !== 'DOWN') dir = 'UP';
  else if(e.key === 'ArrowRight' && dir !== 'LEFT') dir = 'RIGHT';
  else if(e.key === 'ArrowDown' && dir !== 'UP') dir = 'DOWN';
});

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, 400, 400);
  
  for(let i=0; i<snake.length; i++) {
    ctx.fillStyle = i===0 ? '#00ff88' : '#00cc66';
    ctx.fillRect(snake[i].x*box, snake[i].y*box, box-2, box-2);
  }
  
  ctx.fillStyle = '#ff0044';
  ctx.fillRect(food.x*box, food.y*box, box-2, box-2);
  
  let head = {x: snake[0].x, y: snake[0].y};
  if(dir === 'LEFT') head.x--;
  if(dir === 'RIGHT') head.x++;
  if(dir === 'UP') head.y--;
  if(dir === 'DOWN') head.y++;
  
  if(head.x === food.x && head.y === food.y) {
    score++;
    food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
  } else {
    snake.pop();
  }
  
  if(head.x < 0 || head.y < 0 || head.x >= 20 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
    alert('Game Over! Score: ' + score);
    snake = [{x: 9, y: 10}];
    score = 0;
  }
  
  snake.unshift(head);
}

setInterval(draw, 150);
</script>
</body>
</html>
